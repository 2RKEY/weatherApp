<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
</head>
<body>
    <div class="card">
        <h1 class="card__title">Weather App</h1>
        <p class="card__dete">Today, <span id="date"></span></p>
        <div class="card__search">
            <input type="text" class="card__input" placeholder="Enter city name">
            <button class="card__btn" id="searchBtn">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>
        <div class="card__weather">
            <h2 class="card__title card__title--city" id="city"></h2>
            <div class="card__block">
                <h3 class="card__title card__title--temp"></h3>
                <img class="card__weather-icon" alt="Icon">
                </div>
            </div>
        <div class="card__details">
            <div class="card__col">
                <i class="fa-solid fa-wind"></i>
                <p>Wind</p>
                <p class="card__info" id="wind"></p>
            </div>
            <div class="card__col">
                <i class="fa-solid fa-droplet"></i>
                <p>Hum</p>
                <p class="card__info" id="humidity"></p>
            </div>
        </div>
    </div>
    

    <script src="script.js" defer></script>
</body>
</html>
